# SwanStationPS5 - cloud build: the PS5 app and the disc daemon payload.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Download the results from the run's page, under Artifacts:
#   PPSA98510                    PPSA98510.zip, the same zip the releases carry
#   SwanStationPS5-DiscDaemon    SwanStationPS5-DiscDaemon.elf, the payload to send to the console's ELF loader
#                                (port 9021); see payload/discd.c

name: Build SwanStationPS5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps5:
    name: PS5 app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      # SwanStation is the PS5 emulator.
      - name: Fetch submodules
        run: |
          git submodule update --init --recursive --depth=1 third_party/rcheevos
          git submodule update --init --depth=1 third_party/swanstation

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 make ninja-build ccache \
            pkg-config tar unzip wget python3 python3-venv zstd

      - name: Restore downloaded SDK and libraries
        uses: actions/cache@v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
            .deps/lapy
          key: deps-${{ runner.os }}-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py') }}

      # The payload first: it takes seconds, and if it fails nobody waits for the app to build to find out.
      - name: Build the disc daemon payload
        run: make disc-daemon

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make

      - name: Check system module imports
        run: python3 tools/check-imports.py dist/PPSA98510/eboot.bin

      # The same PPSA98510.zip that tools/make_release.py packs for a release.
      - name: Pack PPSA98510.zip
        run: python3 tools/make_release.py --skip-build

      - name: Upload PPSA98510.zip
        uses: actions/upload-artifact@v4
        with:
          name: PPSA98510
          path: PPSA98510.zip
          if-no-files-found: error

      - name: Upload the disc daemon payload
        uses: actions/upload-artifact@v4
        with:
          name: SwanStationPS5-DiscDaemon
          path: dist/SwanStationPS5-DiscDaemon.elf
          if-no-files-found: error
